<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загублені герої — Казкова гра</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Russo+One&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Marcellus', serif;
            user-select: none;
            -webkit-user-select: none;
            background: #0f2310;
            overflow-x: hidden;
        }

        /* Corkboard Texture Background */
        .corkboard {
            background-color: #cb9b64;
            background-image: 
                radial-gradient(rgba(0,0,0,0.18) 15%, transparent 16%),
                radial-gradient(rgba(255,255,255,0.12) 15%, transparent 16%),
                radial-gradient(rgba(80, 50, 20, 0.25) 15%, transparent 20%);
            background-size: 60px 60px, 60px 60px, 40px 40px;
            background-position: 0 0, 30px 30px, 15px 15px;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.75);
        }

        /* Green Vintage Parchment Texture */
        .parchment {
            background: #e2ebd8;
            background-image: radial-gradient(#c3d4b3 10%, transparent 11%);
            background-size: 20px 20px;
            border: 8px solid #2d5a27;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 40px rgba(45,90,39,0.3);
        }

        /* Wooden Green Sign Style */
        .wood-sign {
            background: linear-gradient(180deg, #2d5a27 0%, #173713 100%);
            border: 4px solid #0f280c;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Group Circle Frame with Image */
        .hero-frame {
            border: 5px solid #2d5a27;
            box-shadow: 0 6px 14px rgba(0,0,0,0.4), inset 0 0 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            background-size: cover;
            background-position: center;
        }
        .hero-frame:hover {
            transform: scale(1.04);
            border-color: #529348;
        }
        .hero-frame.selected {
            border-color: #ffd700;
            box-shadow: 0 0 22px #ffd700, inset 0 0 10px rgba(0,0,0,0.3);
        }

        /* Green Styled Book Card */
        .book-card {
            border: 3px solid #d4e5c3;
            box-shadow: -5px 8px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, border-color 0.2s;
        }
        .book-card:hover {
            transform: scale(1.03);
        }
        .book-card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 20px #ffd700;
        }

        /* Pin/Peg style */
        .pin {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #8b0000);
            box-shadow: 2px 4px 6px rgba(0,0,0,0.5);
            border: 2px solid #500;
        }

        /* Compass Rose SVG Overlay */
        .compass-bg {
            opacity: 0.12;
            pointer-events: none;
        }

        /* Connection Canvas */
        #stringCanvas {
            pointer-events: none;
            z-index: 20;
        }

        /* Confetti Canvas */
        #confettiCanvas {
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 md:p-6">

    <!-- Game Container -->
    <div class="relative w-full max-w-5xl parchment rounded-3xl p-4 md:p-8 overflow-hidden select-none">
        
        <!-- Decorative Compass in background -->
        <svg class="absolute top-4 left-4 w-32 h-32 md:w-48 md:h-48 compass-bg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#173713" stroke-width="1.5"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="#173713" stroke-width="0.8" stroke-dasharray="2,2"/>
            <path d="M50 5 L55 45 L95 50 L55 55 L50 95 L45 55 L5 50 L45 45 Z" fill="#2d5a27" opacity="0.6"/>
            <path d="M50 5 L50 50 L95 50 L50 50 L50 95 L50 50 L5 50 L50 50 Z" fill="#0f280c"/>
            <text x="47" y="15" font-size="8" font-weight="bold" fill="#0f280c">N</text>
            <text x="47" y="92" font-size="8" font-weight="bold" fill="#0f280c">S</text>
            <text x="87" y="53" font-size="8" font-weight="bold" fill="#0f280c">E</text>
            <text x="8" y="53" font-size="8" font-weight="bold" fill="#0f280c">W</text>
        </svg>

        <!-- Canvas for interactive strings -->
        <canvas id="stringCanvas" class="absolute inset-0 w-full h-full"></canvas>
        <canvas id="confettiCanvas" class="absolute inset-0 w-full h-full"></canvas>

        <!-- Header Wooden Sign -->
        <div class="relative z-10 text-center mb-4 md:mb-6">
            <div class="inline-block wood-sign text-emerald-100 px-8 py-3 rounded-2xl relative">
                <!-- Rope hanger simulation -->
                <div class="absolute -top-6 left-8 w-1 h-6 bg-emerald-950"></div>
                <div class="absolute -top-6 right-8 w-1 h-6 bg-emerald-950"></div>
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-wide uppercase drop-shadow-md">
                    Загублені герої
                </h1>
            </div>
            
            <!-- Banner note -->
            <div class="mt-3 inline-block bg-emerald-50/90 border-2 border-emerald-800/40 rounded-xl px-4 py-1.5 shadow-sm text-xs md:text-sm text-emerald-950 font-semibold max-w-xl">
                Ці герої блукають і шукають свою казку. Допоможи їм повернутися! <br class="hidden sm:inline">
                <span class="text-emerald-800 font-bold">Натисни на малюнок з героями, а потім на відповідну книжку!</span>
            </div>
        </div>

        <!-- Main Game Area: Corkboard Frame -->
        <div class="relative z-10 corkboard rounded-2xl p-4 md:p-6 border-4 border-emerald-950/70 grid grid-cols-12 gap-4 items-center min-h-[480px]">
            
            <!-- LEFT COLUMN: Hero Group Images (hero1.png - hero4.png) -->
            <div class="col-span-4 md:col-span-4 flex flex-col justify-around h-full space-y-4">
                
                <!-- Hero 1: Червона Шапочка -->
                <div id="left-group-1" data-id="1" onclick="handleSelectLeft(1)" 
                     class="hero-frame cursor-pointer rounded-full w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 mx-auto relative group overflow-visible"
                     style="background-image: url('hero1.png');">
                    <div id="pin-left-1" class="pin absolute -right-2 top-1/2 -translate-y-1/2 z-30"></div>
                </div>

                <!-- Hero 2: Котигорошко -->
                <div id="left-group-2" data-id="2" onclick="handleSelectLeft(2)" 
                     class="hero-frame cursor-pointer rounded-full w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 mx-auto relative group overflow-visible"
                     style="background-image: url('hero2.png');">
                    <div id="pin-left-2" class="pin absolute -right-2 top-1/2 -translate-y-1/2 z-30"></div>
                </div>

                <!-- Hero 3: Колобок -->
                <div id="left-group-3" data-id="3" onclick="handleSelectLeft(3)" 
                     class="hero-frame cursor-pointer rounded-full w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 mx-auto relative group overflow-visible"
                     style="background-image: url('hero3.png');">
                    <div id="pin-left-3" class="pin absolute -right-2 top-1/2 -translate-y-1/2 z-30"></div>
                </div>

                <!-- Hero 4: Дюймовочка -->
                <div id="left-group-4" data-id="4" onclick="handleSelectLeft(4)" 
                     class="hero-frame cursor-pointer rounded-full w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 mx-auto relative group overflow-visible"
                     style="background-image: url('hero4.png');">
                    <div id="pin-left-4" class="pin absolute -right-2 top-1/2 -translate-y-1/2 z-30"></div>
                </div>

            </div>

            <!-- EMPTY MIDDLE SPACE FOR STRINGS (галочки убраны) -->
            <div class="col-span-1 md:col-span-4 flex flex-col justify-around h-full items-center pointer-events-none"></div>

            <!-- RIGHT COLUMN: Books (Перемешаны) -->
            <div class="col-span-7 md:col-span-4 flex flex-col justify-around h-full space-y-3">
                
                <!-- Книга 1 сверху: Колобок (data-id="3") -->
                <div id="right-book-3" data-id="3" onclick="handleSelectRight(3)"
                     class="book-card cursor-pointer rounded-xl p-3 sm:p-4 text-white flex items-center justify-between relative group"
                     style="background: linear-gradient(135deg, #b45309 0%, #6e3002 100%);">
                    <div id="pin-right-3" class="pin absolute -left-2 top-1/2 -translate-y-1/2 z-30"></div>
                    <div class="flex items-center space-x-2 pl-3">
                        <span class="font-bold text-sm sm:text-base md:text-lg tracking-wide">Колобок</span>
                    </div>
                </div>

                <!-- Книга 2: Дюймовочка (data-id="4") -->
                <div id="right-book-4" data-id="4" onclick="handleSelectRight(4)"
                     class="book-card cursor-pointer rounded-xl p-3 sm:p-4 text-white flex items-center justify-between relative group"
                     style="background: linear-gradient(135deg, #2e7d32 0%, #1b4d1e 100%);">
                    <div id="pin-right-4" class="pin absolute -left-2 top-1/2 -translate-y-1/2 z-30"></div>
                    <div class="flex items-center space-x-2 pl-3">
                        <span class="font-bold text-sm sm:text-base md:text-lg tracking-wide">Дюймовочка</span>
                    </div>
                </div>

                <!-- Книга 3: Червона Шапочка (data-id="1") -->
                <div id="right-book-1" data-id="1" onclick="handleSelectRight(1)"
                     class="book-card cursor-pointer rounded-xl p-3 sm:p-4 text-white flex items-center justify-between relative group"
                     style="background: linear-gradient(135deg, #a82323 0%, #681212 100%);">
                    <div id="pin-right-1" class="pin absolute -left-2 top-1/2 -translate-y-1/2 z-30"></div>
                    <div class="flex items-center space-x-2 pl-3">
                        <span class="font-bold text-sm sm:text-base md:text-lg tracking-wide">Червона Шапочка</span>
                    </div>
                </div>

                <!-- Книга 4 снизу: Котигорошко (data-id="2") -->
                <div id="right-book-2" data-id="2" onclick="handleSelectRight(2)"
                     class="book-card cursor-pointer rounded-xl p-3 sm:p-4 text-white flex items-center justify-between relative group"
                     style="background: linear-gradient(135deg, #1b5e20 0%, #0d3b10 100%);">
                    <div id="pin-right-2" class="pin absolute -left-2 top-1/2 -translate-y-1/2 z-30"></div>
                    <div class="flex items-center space-x-2 pl-3">
                        <span class="font-bold text-sm sm:text-base md:text-lg tracking-wide">Котигорошко</span>
                    </div>
                </div>

            </div>

        </div>

        <!-- Action Controls -->
        <div class="mt-6 flex flex-wrap justify-center items-center gap-4 relative z-30">
            <button onclick="checkAnswers()" class="px-7 py-3 rounded-xl bg-gradient-to-r from-emerald-700 to-emerald-900 hover:from-emerald-600 hover:to-emerald-800 text-emerald-100 font-bold shadow-lg border-2 border-emerald-400/50 transition transform hover:-translate-y-0.5 active:translate-y-0">
                Перевірити відповіді
            </button>
            <button onclick="resetGame()" class="px-6 py-3 rounded-xl bg-emerald-950/20 hover:bg-emerald-950/40 text-emerald-900 font-semibold border border-emerald-800/40 transition">
                Скинути нитки
            </button>
        </div>

        <!-- Toast / Message Box -->
        <div id="messageBox" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-950 text-emerald-100 px-6 py-3 rounded-2xl border-2 border-emerald-500 shadow-2xl text-center font-bold text-base transition-all transform">
            <span id="messageText"></span>
        </div>

    </div>

    <script>
        // Game State
        let selectedLeft = null;
        let selectedRight = null;
        
        // Connections stored as: { leftId: rightId }
        let connections = {};
        
        // Colors for strings
        const stringColors = {
            1: '#dc2626', // Red
            2: '#2563eb', // Blue
            3: '#d97706', // Yellow / Gold
            4: '#16a34a'  // Green
        };

        const canvas = document.getElementById('stringCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawStrings();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => {
            resizeCanvas();
            setTimeout(resizeCanvas, 300);
        });

        // Get Pin position relative to canvas
        function getPinPos(id) {
            const pin = document.getElementById(id);
            if (!pin) return { x: 0, y: 0 };
            const pinRect = pin.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            return {
                x: pinRect.left + pinRect.width / 2 - canvasRect.left,
                y: pinRect.top + pinRect.height / 2 - canvasRect.top
            };
        }

        // Handle Left Item Selection
        function handleSelectLeft(id) {
            if (selectedLeft) {
                document.getElementById(`left-group-${selectedLeft}`).classList.remove('selected');
            }
            
            selectedLeft = id;
            document.getElementById(`left-group-${id}`).classList.add('selected');

            if (selectedRight) {
                createConnection(selectedLeft, selectedRight);
            }
        }

        // Handle Right Item Selection
        function handleSelectRight(id) {
            if (selectedRight) {
                document.getElementById(`right-book-${selectedRight}`).classList.remove('selected');
            }

            selectedRight = id;
            document.getElementById(`right-book-${id}`).classList.add('selected');

            if (selectedLeft) {
                createConnection(selectedLeft, selectedRight);
            }
        }

        // Create or update connection
        function createConnection(leftId, rightId) {
            connections[leftId] = rightId;

            document.getElementById(`left-group-${leftId}`).classList.remove('selected');
            document.getElementById(`right-book-${rightId}`).classList.remove('selected');

            selectedLeft = null;
            selectedRight = null;

            drawStrings();
        }

        // Draw realistic curved threads on Canvas
        function drawStrings() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            Object.keys(connections).forEach(leftId => {
                const rightId = connections[leftId];
                const start = getPinPos(`pin-left-${leftId}`);
                const end = getPinPos(`pin-right-${rightId}`);

                const color = stringColors[leftId] || '#d97706';

                ctx.save();
                
                // Shadow for thread depth
                ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetY = 4;

                // Draw realistic wavy rope curve
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);

                const dx = end.x - start.x;
                const dy = end.y - start.y;
                
                const cp1x = start.x + dx * 0.4;
                const cp1y = start.y + dy * 0.1 + (leftId * 14);
                const cp2x = start.x + dx * 0.6;
                const cp2y = start.y + dy * 0.9 - (leftId * 10);

                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

                ctx.strokeStyle = color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Inner thread highlight
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            });
        }

        // Check Answers
        function checkAnswers() {
            const keys = Object.keys(connections);
            if (keys.length < 4) {
                showMessage("З'єднай всі 4 казки ниточками!");
                return;
            }

            let correctCount = 0;
            keys.forEach(leftId => {
                if (parseInt(leftId) === parseInt(connections[leftId])) {
                    correctCount++;
                }
            });

            if (correctCount === 4) {
                showMessage("Чудово! Усі герої повернулися до своїх казок!");
                triggerConfetti();
            } else {
                showMessage(`Правильно з'єднано: ${correctCount} з 4. Спробуй ще раз!`);
            }
        }

        // Reset Game
        function resetGame() {
            connections = {};
            selectedLeft = null;
            selectedRight = null;

            document.querySelectorAll('.hero-frame, .book-card').forEach(el => {
                el.classList.remove('selected');
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            showMessage("Ниточки скинуто. Обери нові пари!");
        }

        // Show Toast Notification
        function showMessage(text) {
            const msgBox = document.getElementById('messageBox');
            const msgText = document.getElementById('messageText');
            msgText.textContent = text;
            msgBox.classList.remove('hidden');

            setTimeout(() => {
                msgBox.classList.add('hidden');
            }, 3000);
        }

        // Confetti Animation
        function triggerConfetti() {
            const cCanvas = document.getElementById('confettiCanvas');
            const cCtx = cCanvas.getContext('2d');
            cCanvas.width = cCanvas.parentElement.getBoundingClientRect().width;
            cCanvas.height = cCanvas.parentElement.getBoundingClientRect().height;

            const particles = [];
            const colors = ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#ec4899'];

            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: cCanvas.width / 2,
                    y: cCanvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    life: 100
                });
            }

            function animateConfetti() {
                cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.2;
                        p.life--;

                        cCtx.fillStyle = p.color;
                        cCtx.beginPath();
                        cCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        cCtx.fill();
                    }
                });

                if (alive) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
                }
            }

            animateConfetti();
        }
    </script>
</body>
</html>
